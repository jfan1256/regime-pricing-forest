data: 'jkp'
dtype: 'float32'
size_list: ['all']
window: 360
max_depth_list: [8]
min_leaf_size: 12
bin: 10
z_list:
- 1.0e-6
- 1.0e-4
- 1.0e-2
- 1.0
- 100.0

